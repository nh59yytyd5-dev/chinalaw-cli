# Include inside the law.newcombmath.com HTTPS server block.
# Public landing page and owner console. The application uses hash navigation
# and absolute /assets and /api URLs, so only the HTML entry point is remapped.
location = / {
    # The OAuth provider in v0.7 sends consent through the original root URL.
    if ($arg_consent != "") { return 302 /console$is_args$args; }
    return 302 /about/;
}
location = /console/ { return 308 /console$is_args$args; }
location = /console {
    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
}
location = /about { return 301 /about/; }
location /about/ {
    alias /usr/share/nginx/html-chinalaw-public/current/;
    index index.html;
    expires 1h;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
location ~ ^/(mcp/?|api/v1/(search|documents?|revisions?))$ {
    limit_req zone=chinalaw_query_rate burst=20 nodelay;
    limit_conn chinalaw_query_concurrency 8;
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @chinalaw_rate_limited;
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 600s;
}
location @chinalaw_rate_limited {
    default_type application/json;
    add_header Retry-After 2 always;
    add_header Cache-Control no-store always;
    return 429 '{"error":"rate_limited","message":"Please wait and retry, or use the downloadable public dataset."}';
}
