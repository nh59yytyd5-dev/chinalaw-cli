# Install at nginx http scope. Only query POSTs and REST query GETs count.
# Idle SSE streams do not occupy query slots. The SNI proxy masks client IPs,
# so authenticated tokens are rate keys; missing credentials share one bucket.
map $http_authorization $chinalaw_auth_key {
    "" "anonymous";
    default $http_authorization;
}

map "$request_method:$uri" $chinalaw_query_key {
    default "";
    ~^POST:/mcp/?$ $chinalaw_auth_key;
    ~^GET:/api/v1/(search|documents?|revisions?)$ $chinalaw_auth_key;
}
map "$request_method:$uri" $chinalaw_query_global {
    default "";
    ~^POST:/mcp/?$ "chinalaw";
    ~^GET:/api/v1/(search|documents?|revisions?)$ "chinalaw";
}
limit_req_zone $chinalaw_query_key zone=chinalaw_query_rate:10m rate=5r/s;
limit_conn_zone $chinalaw_query_global zone=chinalaw_query_concurrency:1m;
