name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# 默认离线 CI：不联网执行 verify-source / probe，避免上游波动导致红 build
# （维护者可在 release 前手工执行 PYTHONPATH=src python3 -m chinalaw verify-source ...）
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show versions
        run: |
          python --version
          python -c "import sqlite3; print('sqlite', sqlite3.sqlite_version)"

      - name: Compile-only sanity check
        env:
          PYTHONPATH: src
        run: python -m compileall -q src tests

      - name: Validate public fixtures
        run: python scripts/check-public-fixtures

      - name: Run unit tests (offline)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Run pytest release gate
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: |
          python -m pip install --upgrade "pytest>=8"
          python -m pytest -q --junitxml="$RUNNER_TEMP/pytest.xml"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "pytest.xml")).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
          maximum = 32
          if skipped > maximum:
              raise SystemExit(f"pytest skip budget exceeded: {skipped} > {maximum}")
          print(f"pytest skip budget: {skipped}/{maximum}")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade "ruff>=0.5"

      - name: Lint with ruff
        run: ruff check src tests tests_server

  server-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,server]"
      - name: Install optional PDF reader
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pytest tests_server -q

  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e ".[server]"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Check bundled UI matches source
        run: |
          git diff --exit-code -- src/chinalaw/server/static
          # git diff 不报告未跟踪的新文件（例如新的 hash 命名 chunk），用 porcelain 兜底。
          test -z "$(git status --porcelain -- src/chinalaw/server/static)"
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: web/test-results

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: CHINALAW_DOMAIN=library.example docker compose -f deploy/compose.yaml config -q
      - run: docker build -t chinalaw-server:test .
      - name: Initialize isolated container library
        run: |
          docker volume create chinalaw-test
          docker run --rm -v chinalaw-test:/data chinalaw-server:test chinalaw-server init --db /data/library.db --with-fixtures
          docker run --rm -v chinalaw-test:/data chinalaw-server:test python -c "from chinalaw.server.auth_store import AuthStore; AuthStore('/data/server-state/auth.db','https://library.example/mcp').set_password('synthetic-container-test-password')"
      - name: Start and check server mode
        run: |
          docker run -d --name chinalaw-test -p 127.0.0.1:8765:8765 -v chinalaw-test:/data -e CHINALAW_PUBLIC_URL=https://library.example chinalaw-server:test
          for attempt in $(seq 1 30); do
            if curl -fsS -H 'Host: library.example' http://127.0.0.1:8765/healthz; then break; fi
            sleep 1
          done
          curl -fsS -H 'Host: library.example' http://127.0.0.1:8765/healthz
          curl -fsS -H 'Host: library.example' http://127.0.0.1:8765/ > /tmp/chinalaw-index.html
          python -c "from pathlib import Path; assert '/assets/' in Path('/tmp/chinalaw-index.html').read_text()"
      - name: Container logs
        if: failure()
        run: docker logs chinalaw-test

  windows-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show versions
        shell: pwsh
        run: |
          python --version
          python -c "import sqlite3; print('sqlite', sqlite3.sqlite_version)"

      - name: Install editable package
        run: python -m pip install -e .

      - name: Smoke init and article lookup
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP "chinalaw-windows.db"
          $initJson = chinalaw --no-notice --db $db init --format json
          if ($LASTEXITCODE -ne 0) { throw "chinalaw init failed with exit $LASTEXITCODE" }
          $init = $initJson | ConvertFrom-Json
          if (-not $init.ok) { throw "chinalaw init returned ok=false" }

          $articleJson = chinalaw --no-notice --db $db article 民法典 第一百四十三条 --format json
          if ($LASTEXITCODE -ne 0) { throw "chinalaw article failed with exit $LASTEXITCODE" }
          $article = $articleJson | ConvertFrom-Json
          if ($null -eq $article.article) { throw "article lookup returned article=null" }

          $doctorJson = chinalaw --no-notice --db $db doctor --format json
          if ($LASTEXITCODE -ne 0) { throw "chinalaw doctor failed with exit $LASTEXITCODE" }
          $doctor = $doctorJson | ConvertFrom-Json
          if (-not $doctor.ok) { throw "chinalaw doctor returned ok=false" }

      - name: Smoke Unicode and percent installation paths
        shell: pwsh
        run: |
          $copyRoot = Join-Path $env:RUNNER_TEMP "法规%路径-chinalaw"
          $binDir = Join-Path $env:RUNNER_TEMP "工具%目录"
          $venvDir = Join-Path $env:RUNNER_TEMP "venv-unicode"
          New-Item -ItemType Directory -Force -Path $copyRoot | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "*") -Destination $copyRoot -Recurse -Force
          $env:CHINALAW_BIN_DIR = $binDir
          $env:CHINALAW_VENV = $venvDir
          & (Join-Path $copyRoot "scripts\install-local.ps1")
          & (Join-Path $binDir "chinalaw.cmd") --version
          if ($LASTEXITCODE -ne 0) { throw "Unicode/% cmd shim failed" }

  install-smoke:
    name: install-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with scripts/install-local
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export CHINALAW_BIN_DIR="$RUNNER_TEMP/chinalaw-bin"
          scripts/install-local
          export PATH="$CHINALAW_BIN_DIR:$PATH"
          db="$RUNNER_TEMP/chinalaw-install-smoke.db"
          chinalaw --no-notice --db "$db" init --format json
          chinalaw --no-notice --db "$db" article 民法典 第一百四十三条 --format json
          chinalaw --no-notice --db "$db" doctor --format json

      - name: Install with scripts/install-local.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CHINALAW_BIN_DIR = Join-Path $env:RUNNER_TEMP "chinalaw-bin"
          .\scripts\install-local.ps1
          $env:PATH = "$env:CHINALAW_BIN_DIR;$env:PATH"
          $db = Join-Path $env:RUNNER_TEMP "chinalaw-install-smoke.db"

          $initJson = chinalaw --no-notice --db $db init --format json
          if ($LASTEXITCODE -ne 0) { throw "chinalaw init failed with exit $LASTEXITCODE" }
          $init = $initJson | ConvertFrom-Json
          if (-not $init.ok) { throw "chinalaw init returned ok=false" }

          $articleJson = chinalaw --no-notice --db $db article 民法典 第一百四十三条 --format json
          if ($LASTEXITCODE -ne 0) { throw "chinalaw article failed with exit $LASTEXITCODE" }
          $article = $articleJson | ConvertFrom-Json
          if ($null -eq $article.article) { throw "article lookup returned article=null" }

          $doctorJson = chinalaw --no-notice --db $db doctor --format json
          if ($LASTEXITCODE -ne 0) { throw "chinalaw doctor failed with exit $LASTEXITCODE" }
          $doctor = $doctorJson | ConvertFrom-Json
          if (-not $doctor.ok) { throw "chinalaw doctor returned ok=false" }

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, windows-smoke, install-smoke, server-test, web-test, container-smoke]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build

      - name: Inspect sdist contents
        run: |
          python - <<'PY'
          import glob
          import tarfile

          archive = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(archive) as bundle:
              names = bundle.getnames()
          assert any(name.endswith("data/public_fixture_manifest.json") for name in names)
          assert not any("/.agents/" in name for name in names)
          PY

      - name: Inspect wheel contents
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as bundle:
              names = set(bundle.namelist())
          for required in (
              "chinalaw/server/static/index.html",
              "chinalaw/server/static/assets/third-party-licenses.txt",
          ):
              assert required in names, f"wheel is missing {required}"
          PY

      - name: Smoke installed wheel with server extra
        run: |
          python -m venv "$RUNNER_TEMP/wheel-server-smoke"
          . "$RUNNER_TEMP/wheel-server-smoke/bin/activate"
          python -m pip install "$(ls dist/*.whl)[server]"
          chinalaw-server --version
          chinalaw-server init --db "$RUNNER_TEMP/server-smoke.db" --json
          deactivate

      - name: Smoke installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          . "$RUNNER_TEMP/wheel-smoke/bin/activate"
          python -m pip install dist/*.whl
          db="$RUNNER_TEMP/wheel-smoke.db"
          chinalaw --no-notice --db "$db" init --format json
          chinalaw --no-notice --db "$db" article 民法典 第一百四十三条 --format json
          chinalaw --no-notice corpus list --format json
          chinalaw --no-notice sources list --format json
          chinalaw --no-notice --db "$db" doctor --format json
          deactivate

      - name: Smoke installed sdist
        run: |
          python -m venv "$RUNNER_TEMP/sdist-smoke"
          . "$RUNNER_TEMP/sdist-smoke/bin/activate"
          python -m pip install dist/*.tar.gz
          db="$RUNNER_TEMP/sdist-smoke.db"
          chinalaw --no-notice --db "$db" init --format json
          chinalaw --no-notice --db "$db" article 民法典 第一百四十三条 --format json
          chinalaw --no-notice corpus list --format json
          chinalaw --no-notice sources list --format json
          chinalaw --no-notice --db "$db" doctor --format json
          deactivate

      - name: Smoke user-site wheel shared data
        run: |
          export PYTHONUSERBASE="$RUNNER_TEMP/userbase"
          python -m pip install --user --force-reinstall dist/*.whl
          export PATH="$PYTHONUSERBASE/bin:$PATH"
          db="$RUNNER_TEMP/user-site-smoke.db"
          chinalaw --no-notice --db "$db" init --format json
          chinalaw --no-notice --db "$db" article 民法典 第一百四十三条 --format json
          chinalaw --no-notice corpus list --format json
          chinalaw --no-notice sources list --format json
          chinalaw --no-notice --db "$db" doctor --format json
